name = "maskoff-site"
main = "worker/index.ts"
compatibility_date = "2025-06-01"

[assets]
directory = "./out"
binding = "ASSETS"
not_found_handling = "404-page"
# 静的アセットは Worker を経由せず配信。/api/* のみ Worker を起動（無料枠を温存）
run_worker_first = ["/api/*"]

[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[vars]
SITE_URL = "https://maskoff.co.jp"
MAIL_FROM = "MasKOFF <noreply@maskoff.co.jp>"
MAIL_TO = "info@maskoff.co.jp"
GITHUB_REPO = "maskoff/maskoff-site"

# Secrets（wrangler secret put で登録 / ローカルは .dev.vars）
#   RESEND_API_KEY
#   TURNSTILE_SECRET_KEY
#   MICROCMS_WEBHOOK_SECRET
#   GITHUB_TOKEN  (repo scope / workflow_dispatch 用 fine-grained token)
