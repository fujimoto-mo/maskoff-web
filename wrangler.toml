name = "maskoff-site"
main = "worker/index.ts"
compatibility_date = "2025-06-01"

[assets]
directory = "./out"
binding = "ASSETS"
not_found_handling = "404-page"
# /api/* と HTML ページは Worker を通す（メンテナンス時に 503 を返すため）。
# _next / images / fonts / videos 等の静的アセットは除外し、Worker を経由せず無課金で配信（無料枠を温存）
run_worker_first = ["/*", "!/_next/*", "!/images/*", "!/fonts/*", "!/videos/*", "!/favicon.ico", "!/robots.txt", "!/sitemap.xml"]

[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[vars]
# メンテナンス切替。"1" にして push すると全ページが 503 のメンテ画面（worker/maintenance.ts）。戻すときは "0"
MAINTENANCE = "1"
SITE_URL = "https://maskoff.co.jp"
CONTACT_FROM_EMAIL = "MasKOFF <noreply@maskoff.co.jp>"
CONTACT_TO_EMAIL = "info@maskoff.co.jp"
GITHUB_REPO = "fujimoto-mio/maskoff-web"

# Secrets（wrangler secret put で登録 / ローカルは .dev.vars）
#   RESEND_API_KEY / TURNSTILE_SECRET_KEY / MICROCMS_WEBHOOK_SECRET / GITHUB_DISPATCH_TOKEN / SLACK_WEBHOOK_URL
